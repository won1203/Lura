spring:
  datasource:
    url: jdbc:h2:mem:lura;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

lura:
  aws:
    s3:
      bucket: test-bucket
      region: ap-northeast-2
      presigned-url-duration-minutes: 10
