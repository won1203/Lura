spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lura?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: 8080

lura:
  aws:
    s3:
      bucket: ${LURA_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
      presigned-url-duration-minutes: ${LURA_S3_PRESIGNED_URL_DURATION_MINUTES:720}
